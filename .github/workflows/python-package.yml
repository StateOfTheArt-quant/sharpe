# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: unit-testing

on:
  # Tags only: merging a pull request runs no CI -- the organisation shares one
  # runner, and a tag is the point where the cost is worth paying.
  # workflow_dispatch stays so a branch can be checked on demand.
  push:
    tags: ['**']
  workflow_dispatch:
    inputs:
      runner_labels:
        description: JSON array of runner labels; empty uses RUNNER_LABELS
        type: string
        default: ''

jobs:
  build:

    runs-on: ${{ fromJSON(inputs.runner_labels || vars.RUNNER_LABELS || '["self-hosted","Linux","X64"]') }}
    strategy:
      matrix:
        python-version: [3.6, 3.7, 3.8]

    steps:
    - 
      name: git checkout
      uses: actions/checkout@v2
    - 
      name: check the working directory
      run: pwd
    - 
      name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - 
      name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - 
      name: install library
      run: python setup.py install

    - 
      name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - 
      name: Test with pytest
      run: |
        pytest
